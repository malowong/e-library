services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elibrary
      POSTGRES_PASSWORD: elibrary
      POSTGRES_DB: elibrary
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elibrary"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      ELIBRARY_DATABASE_URL: postgresql+asyncpg://elibrary:elibrary@db:5432/elibrary
      ELIBRARY_JWT_SECRET: local-development-secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
